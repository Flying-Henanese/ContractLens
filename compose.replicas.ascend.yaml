# Opt-in Ascend overlay. Workers share the existing Pipeline NPU; validate capacity on hardware.
x-pipeline: &pipeline
  image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${ASCEND_API_IMAGE_TAG:-latest-huawei-npu}
  user: root
  init: true
  # 非特权运行：通过 devices 精确挂载所需 NPU，回滚时在 .env 设 ASCEND_PRIVILEGED=true
  privileged: ${ASCEND_PRIVILEGED:-false}
  cap_add:
    - SYS_PTRACE
  devices:
    - /dev/davinci${PIPELINE_NPU_ID:-7}
    - /dev/davinci_manager
    - /dev/devmm_svm
    - /dev/hisi_hdc
  depends_on:
    paddleocr-vlm-server:
      condition: service_healthy
  environment:
    ASCEND_RT_VISIBLE_DEVICES: ${PIPELINE_NPU_ID:-7}
    PIPELINE_SUBGRAPH_CONCURRENCY: ${PIPELINE_SUBGRAPH_CONCURRENCY:-16}
  command:
    - bash
    - /opt/paddleocr-server/docker/pipeline-replicas-entrypoint-ascend.sh
  volumes:
    - ./paddleocr-server:/opt/paddleocr-server:ro
    - ${PADDLEX_CACHE_DIR:-/home/mineru_dev/.paddlex}:/home/paddleocr/.paddlex
    - /usr/local/Ascend/driver:/usr/local/Ascend/driver
    - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
    - /usr/local/dcmi:/usr/local/dcmi
    - /etc/ascend_install.info:/etc/ascend_install.info:ro
    - /var/log/npu:/var/log/npu
  shm_size: 64gb
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 180s

services:
  paddleocr-vl-api: !override
    image: ${PIPELINE_PROXY_IMAGE:-nginx:1.29.7-alpine}
    init: true
    restart: unless-stopped
    environment:
      PIPELINE_2_STATE: ""
      PIPELINE_EXTRA_UPSTREAMS: ""
      NGINX_ENVSUBST_FILTER: ^PIPELINE_(2_STATE|EXTRA_UPSTREAMS)$
    ports:
      - "${API_PORT:-8880}:8080"
    volumes:
      - ./paddleocr-server/nginx/replicas.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /var/cache/nginx:size=64m,mode=1777
    depends_on:
      pipeline-1:
        condition: service_healthy
      pipeline-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  pipeline-1:
    <<: *pipeline
  pipeline-2:
    <<: *pipeline
