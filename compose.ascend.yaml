name: contractlens

services:
  api:
    image: ${PDF_PARSER_ASCEND_IMAGE:-pdf-parser:ascend-ubuntu22.04}
    build:
      context: .
      dockerfile: ${PDF_PARSER_ASCEND_DOCKERFILE:-Dockerfile.ascend}
      args:
        ASCEND_BASE_IMAGE: ${ASCEND_BASE_IMAGE:-ubuntu:22.04}
        PYTHON_VERSION: "3.11"
        UV_VERSION: "0.11.32"
    restart: unless-stopped
    init: true
    entrypoint:
      - uvicorn
      - pdf_parser.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8888"
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - "${PDF_PARSER_PORT:-8888}:8888"
    environment:
      PYTHONPATH: /app/src
      PDF_PARSER_ENDPOINT: http://paddleocr-vl-api:8080
      PDF_PARSER_TIMEOUT_SECONDS: ${PDF_PARSER_TIMEOUT_SECONDS:-120}
      PDF_PARSER_RETRIES: ${PDF_PARSER_RETRIES:-2}
      PDF_PARSER_CONCURRENCY: ${PDF_PARSER_CONCURRENCY:-1}
      PDF_PARSER_USE_LAYOUT_DETECTION: ${PDF_PARSER_USE_LAYOUT_DETECTION:-true}
      PDF_PARSER_LAYOUT_THRESHOLD: ${PDF_PARSER_LAYOUT_THRESHOLD:-0.5}
      PDF_PARSER_TRUST_ENV: ${PDF_PARSER_TRUST_ENV:-false}
    read_only: true
    tmpfs:
      - /tmp:size=${PDF_PARSER_TMPFS_SIZE:-2g},mode=1777
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:${ASCEND_VLM_IMAGE_TAG:-latest-huawei-npu}
    user: root
    init: true
    privileged: true
    environment:
      ASCEND_RT_VISIBLE_DEVICES: ${VLM_NPU_IDS:-4,5,6}
      VLM_MODEL: ${VLM_MODEL:-PaddleOCR-VL-1.6-0.9B}
      VLM_DATA_PARALLEL_SIZE: ${VLM_DATA_PARALLEL_SIZE:-3}
      VLM_DATA_PARALLEL_BACKEND: ${VLM_DATA_PARALLEL_BACKEND:-mp}
      VLM_GPU_MEMORY_UTILIZATION: ${VLM_GPU_MEMORY_UTILIZATION:-0.3}
      VLM_MAX_NUM_SEQS: ${VLM_MAX_NUM_SEQS:-16}
      VLM_MAX_NUM_BATCHED_TOKENS: ${VLM_MAX_NUM_BATCHED_TOKENS:-16384}
    command:
      - /bin/bash
      - /opt/paddleocr-server/docker/vlm-entrypoint-ascend.sh
    volumes:
      - ./paddleocr-server:/opt/paddleocr-server:ro
      - ${PADDLEX_CACHE_DIR:-/home/mineru_dev/.paddlex}:/home/paddleocr/.paddlex
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
    shm_size: 64gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8118/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: ${STARTUP_TIMEOUT:-900}s

  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${ASCEND_API_IMAGE_TAG:-latest-huawei-npu}
    user: root
    init: true
    privileged: true
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    environment:
      ASCEND_RT_VISIBLE_DEVICES: ${PIPELINE_NPU_ID:-7}
    command:
      - paddlex
      - --serve
      - --pipeline
      - /opt/paddleocr-server/PaddleOCR-VL-1.6.yaml
      - --device
      - npu:0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${API_PORT:-8880}:8080"
    volumes:
      - ./paddleocr-server:/opt/paddleocr-server:ro
      - ${PADDLEX_CACHE_DIR:-/home/mineru_dev/.paddlex}:/home/paddleocr/.paddlex
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
    shm_size: 64gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
