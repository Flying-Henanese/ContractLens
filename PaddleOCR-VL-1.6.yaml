
pipeline_name: PaddleOCR-VL-1.6

batch_size: 64

use_queues: True

use_doc_preprocessor: True
use_layout_detection: True
use_chart_recognition: True
use_seal_recognition: True
format_block_content: True
merge_layout_blocks: True
markdown_ignore_labels:
  - number
  - footnote
  - header
  - header_image
  - footer
  - footer_image
  - aside_text

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayoutV3
    model_dir: null
    batch_size: 8
    threshold:
      0: 0.3
      1: 0.3
      2: 0.3
      3: 0.3
      4: 0.3
      5: 0.3
      6: 0.3
      7: 0.3
      8: 0.3
      9: 0.3
      10: 0.3
      11: 0.3
      12: 0.3
      13: 0.3
      14: 0.3
      15: 0.3
      16: 0.3
      17: 0.3
      18: 0.3
      19: 0.3
      20: 0.9  # seal
      21: 0.3
      22: 0.3
      23: 0.3
      24: 0.3
    layout_nms: True
    layout_unclip_ratio: [1.0, 1.0]
    layout_merge_bboxes_mode:
      0: "union" # abstract
      1: "union" # algorithm
      2: "union" # aside_text
      3: "large" # chart
      4: "union" # content
      5: "large" # display_formula
      6: "large" # doc_title
      7: "union" # figure_title
      8: "union" # footer
      9: "union" # footer
      10: "union" # footnote
      11: "union" # formula_number
      12: "union" # header
      13: "union" # header
      14: "union" # image
      15: "large" # inline_formula
      16: "union" # number
      17: "large" # paragraph_title
      18: "union" # reference
      19: "union" # reference_content
      20: "union" # seal
      21: "union" # table
      22: "union" # text
      23: "union" # text
      24: "union" # vision_footnote
  VLRecognition:
    module_name: vl_recognition
    model_name: PaddleOCR-VL-1.6-0.9B
    model_dir: null
    # 这里最好采用与你当前 PaddleX 版本匹配的官方 vLLM 模板值
    batch_size: 4096
    genai_config:
      backend: vllm-server
      # Docker Compose 使用服务名；start_vl.sh 会生成指向 127.0.0.1 的本地配置。
      server_url: http://paddleocr-vlm-server:8118/v1
      # PaddleOCR 会将版面子图并发提交给多个 VLM 副本。
      max_concurrency: 16

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    batch_size: 8
    use_doc_orientation_classify: True
    use_doc_unwarping: True
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
        batch_size: 8
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        model_dir: null

Serving:
  # 禁用可视化和中间图 Base64 编码，减少非推理开销。
  visualize: false
  extra:
    max_num_input_imgs: null
