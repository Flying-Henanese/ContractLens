name: contractlens

services:
  api:
    image: ${PDF_PARSER_IMAGE:-pdf-parser:cuda12.2}
    build:
      context: .
      dockerfile: ${PDF_PARSER_DOCKERFILE:-Dockerfile}
      args:
        ASCEND_BASE_IMAGE: ${ASCEND_BASE_IMAGE:-ubuntu:22.04}
        CUDA_VERSION: "12.2.2"
        UBUNTU_VERSION: "22.04"
        PYTHON_VERSION: "3.11"
        UV_VERSION: "0.11.32"
    restart: unless-stopped
    init: true
    entrypoint:
      - uvicorn
      - pdf_parser.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8888"
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - "${PDF_PARSER_PORT:-8888}:8888"
    environment:
      PYTHONPATH: /app/src
      # 在统一 Compose 中通过服务 DNS 调用同一项目内的 PaddleX Pipeline。
      # 本地 CLI/开发可继续使用 PDF_PARSER_ENDPOINT 配置独立远端地址。
      PDF_PARSER_ENDPOINT: ${PDF_PARSER_DOCKER_ENDPOINT:-http://paddleocr-vl-api:8080}
      PDF_PARSER_TIMEOUT_SECONDS: ${PDF_PARSER_TIMEOUT_SECONDS:-120}
      PDF_PARSER_RETRIES: ${PDF_PARSER_RETRIES:-2}
      PDF_PARSER_CONCURRENCY: ${PDF_PARSER_CONCURRENCY:-1}
      PDF_PARSER_USE_LAYOUT_DETECTION: ${PDF_PARSER_USE_LAYOUT_DETECTION:-true}
      PDF_PARSER_LAYOUT_THRESHOLD: ${PDF_PARSER_LAYOUT_THRESHOLD:-0.5}
      PDF_PARSER_TRUST_ENV: ${PDF_PARSER_TRUST_ENV:-false}
    read_only: true
    tmpfs:
      - /tmp:size=${PDF_PARSER_TMPFS_SIZE:-2g},mode=1777
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:${VLM_IMAGE_TAG:-latest-nvidia-gpu}
    # 与 PaddleOCR 官方 Compose 保持一致，避免模型缓存和设备权限问题。
    user: root
    init: true
    ports:
      - "${VLM_PORT:-8118}:8118"
    environment:
      CUDA_VISIBLE_DEVICES: ${VLM_GPU_IDS:-5,6}
      VLM_MODEL: ${VLM_MODEL:-PaddleOCR-VL-1.6-0.9B}
      VLM_DATA_PARALLEL_SIZE: ${VLM_DATA_PARALLEL_SIZE:-2}
      VLM_DATA_PARALLEL_BACKEND: ${VLM_DATA_PARALLEL_BACKEND:-mp}
      VLM_GPU_MEMORY_UTILIZATION: ${VLM_GPU_MEMORY_UTILIZATION:-0.8}
      VLM_MAX_NUM_SEQS: ${VLM_MAX_NUM_SEQS:-16}
      VLM_MAX_NUM_BATCHED_TOKENS: ${VLM_MAX_NUM_BATCHED_TOKENS:-16384}
      NCCL_DEBUG: INFO
      NCCL_P2P_DISABLE: "1"
      NCCL_IB_DISABLE: "1"
    command:
      - /bin/bash
      - /opt/paddleocr-server/vlm-entrypoint.sh
    volumes:
      - ./paddleocr-server:/opt/paddleocr-server:ro
      - ${PADDLEX_CACHE_DIR:-/home/mineru_dev/.paddlex}:/home/paddleocr/.paddlex
    shm_size: 64gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8118/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: ${STARTUP_TIMEOUT:-900}s

  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG:-latest-nvidia-gpu}
    user: root
    init: true
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    environment:
      CUDA_VISIBLE_DEVICES: ${PIPELINE_GPU_ID:-4}
    command:
      - paddlex
      - --serve
      - --pipeline
      - /opt/paddleocr-server/PaddleOCR-VL-1.6.yaml
      - --device
      - gpu:0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${API_PORT:-8880}:8080"
    volumes:
      - ./paddleocr-server:/opt/paddleocr-server:ro
      - ${PADDLEX_CACHE_DIR:-/home/mineru_dev/.paddlex}:/home/paddleocr/.paddlex
    shm_size: 64gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
