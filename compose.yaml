name: pdf-parser

services:
  api:
    image: ${PDF_PARSER_IMAGE:-pdf-parser:cuda12.2}
    build:
      context: .
      dockerfile: ${PDF_PARSER_DOCKERFILE:-Dockerfile}
      args:
        ASCEND_BASE_IMAGE: ${ASCEND_BASE_IMAGE:-ubuntu:22.04}
        CUDA_VERSION: "12.2.2"
        UBUNTU_VERSION: "22.04"
        PYTHON_VERSION: "3.11"
        UV_VERSION: "0.11.32"
    restart: unless-stopped
    init: true
    entrypoint:
      - uvicorn
      - pdf_parser.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8888"
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - "${PDF_PARSER_PORT:-8888}:8888"
    environment:
      PYTHONPATH: /app/src
      PDF_PARSER_ENDPOINT: ${PDF_PARSER_ENDPOINT:-http://192.168.0.194:8080}
      PDF_PARSER_TIMEOUT_SECONDS: ${PDF_PARSER_TIMEOUT_SECONDS:-120}
      PDF_PARSER_RETRIES: ${PDF_PARSER_RETRIES:-2}
      PDF_PARSER_CONCURRENCY: ${PDF_PARSER_CONCURRENCY:-1}
      PDF_PARSER_USE_LAYOUT_DETECTION: ${PDF_PARSER_USE_LAYOUT_DETECTION:-true}
      PDF_PARSER_LAYOUT_THRESHOLD: ${PDF_PARSER_LAYOUT_THRESHOLD:-0.5}
      PDF_PARSER_TRUST_ENV: ${PDF_PARSER_TRUST_ENV:-false}
    read_only: true
    tmpfs:
      - /tmp:size=${PDF_PARSER_TMPFS_SIZE:-2g},mode=1777
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
