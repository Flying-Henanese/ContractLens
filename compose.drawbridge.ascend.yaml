name: contractlens

services:
  api:
    image: pdf-parser:ascend-ubuntu22.04
    build:
      context: .
      dockerfile: Dockerfile.ascend
    restart: unless-stopped
    init: true
    entrypoint:
      - uvicorn
      - pdf_parser.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8888"
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - "8888:8888"
    environment:
      PYTHONPATH: /app/src
      PDF_PARSER_ENDPOINT: http://paddleocr-vl-api:8080
      PDF_PARSER_TIMEOUT_SECONDS: "120"
      PDF_PARSER_RETRIES: "2"
      PDF_PARSER_CONCURRENCY: "1"
      PDF_PARSER_USE_LAYOUT_DETECTION: "true"
      PDF_PARSER_LAYOUT_THRESHOLD: "0.5"
      PDF_PARSER_TRUST_ENV: "false"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:latest-huawei-npu
    user: root
    init: true
    privileged: true
    environment:
      ASCEND_RT_VISIBLE_DEVICES: "4,5,6"
      VLM_MODEL: PaddleOCR-VL-1.6-0.9B
      VLM_DATA_PARALLEL_SIZE: "3"
      VLM_DATA_PARALLEL_BACKEND: mp
      VLM_GPU_MEMORY_UTILIZATION: "0.3"
      VLM_MAX_NUM_SEQS: "16"
      VLM_MAX_NUM_BATCHED_TOKENS: "16384"
    command:
      - /bin/bash
      - /opt/paddleocr-server/docker/vlm-entrypoint-ascend.sh
    volumes:
      - ./paddleocr-server:/opt/paddleocr-server:ro
      - /home/mineru_dev/.paddlex:/home/paddleocr/.paddlex
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - /var/log/npu:/var/log/npu
    shm_size: 64gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8118/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 900s

  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:latest-huawei-npu
    user: root
    init: true
    privileged: true
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    environment:
      ASCEND_RT_VISIBLE_DEVICES: "7"
    command:
      - paddlex
      - --serve
      - --pipeline
      - /opt/paddleocr-server/PaddleOCR-VL-1.6.yaml
      - --device
      - npu:0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "8880:8080"
    volumes:
      - ./paddleocr-server:/opt/paddleocr-server:ro
      - /home/mineru_dev/.paddlex:/home/paddleocr/.paddlex
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - /var/log/npu:/var/log/npu
    shm_size: 64gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
